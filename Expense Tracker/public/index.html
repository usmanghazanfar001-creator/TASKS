<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tracker</title>
<style>
  :root { --bg:#f3f7f4; --card:#fff; --ink:#1d2a24; --muted:#6a7a71; --line:#dfe8e2; --accent:#1f8a5b; --inc:#1f8a5b; --exp:#d2533f; --blue:#2a6fdb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--accent); color:#fff; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; }
  header b { font-size:1.2rem; }
  main { max-width:1000px; margin:22px auto; padding:0 16px; display:grid; gap:18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; }
  h2 { margin:0 0 12px; font-size:1.02rem; }
  input, select { padding:9px 10px; border:1px solid var(--line); border-radius:6px; font-size:.95rem; width:100%; background:#fff; }
  button { padding:9px 14px; border:0; border-radius:6px; background:var(--accent); color:#fff; cursor:pointer; font-size:.9rem; }
  button.ghost { background:#e6eee9; color:var(--ink); }
  button.danger { background:var(--exp); }
  header button { background:rgba(255,255,255,.2); }
  .grid3 { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; }
  .stat small { color:var(--muted); display:block; margin-bottom:4px; }
  .stat strong { font-size:1.6rem; }
  .inc { color:var(--inc); } .exp { color:var(--exp); }
  .two { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:18px; }
  form.tx { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .row { display:flex; gap:8px; align-items:center; }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .bar input, .bar select { width:auto; }
  .wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); font-size:.9rem; white-space:nowrap; }
  th { color:var(--muted); font-weight:600; }
  .cat { margin:9px 0; font-size:.9rem; }
  .cat .track { background:#edf2ee; border-radius:5px; height:10px; margin-top:4px; }
  .cat .fill { background:var(--exp); height:100%; border-radius:5px; }
  .msg { min-height:1.2em; margin-top:8px; font-size:.9rem; color:var(--exp); }
  .empty { color:var(--muted); font-size:.9rem; }
  #authView { max-width:380px; margin:60px auto; }
  #authView form { display:grid; gap:10px; }
  .link { background:none; color:var(--blue); padding:0; }
  .legend span { display:inline-block; width:10px; height:10px; border-radius:2px; margin:0 4px 0 12px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header><b>💰 Expense Tracker</b><div class="row" id="userBox" hidden><span id="userName"></span><button id="logout">Log out</button></div></header>

<!-- Authentication screen -->
<div id="authView" class="card">
  <h2 id="authTitle">Log in</h2>
  <form id="authForm">
    <input name="name" placeholder="Full name" id="nameField" hidden>
    <input name="email" type="email" placeholder="Email" required>
    <input name="password" type="password" placeholder="Password (min 6 chars)" required>
    <button type="submit" id="authBtn">Log in</button>
  </form>
  <div class="msg" id="authMsg"></div>
  <button class="link" id="toggleAuth">No account? Register</button>
</div>

<!-- Dashboard -->
<main id="dash" hidden>
  <div class="bar" style="margin:0">
    <h2 style="margin:0">Dashboard</h2>
    <input type="month" id="month">
  </div>

  <div class="grid3">
    <div class="card stat"><small>Income</small><strong class="inc" id="sIncome">0</strong></div>
    <div class="card stat"><small>Expenses</small><strong class="exp" id="sExpense">0</strong></div>
    <div class="card stat"><small>Balance</small><strong id="sBalance">0</strong></div>
  </div>

  <div class="two">
    <div class="card">
      <h2>Spending by category</h2>
      <div id="cats"></div>
    </div>
    <div class="card">
      <h2>Monthly trend <span class="legend"><span style="background:var(--inc)"></span>Income<span style="background:var(--exp)"></span>Expense</span></h2>
      <div id="trend"></div>
    </div>
  </div>

  <div class="card">
    <h2 id="formTitle">Add transaction</h2>
    <form class="tx" id="txForm">
      <select name="type"><option value="expense">Expense</option><option value="income">Income</option></select>
      <input name="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required>
      <input name="category" placeholder="Category (e.g. Food)" list="cats-list" required>
      <datalist id="cats-list"><option>Food</option><option>Rent</option><option>Transport</option><option>Bills</option><option>Shopping</option><option>Health</option><option>Salary</option></datalist>
      <input name="date" type="date" required>
      <input name="description" placeholder="Note (optional)">
      <div class="row"><button type="submit" id="txBtn">Add</button><button type="button" class="ghost" id="txCancel" hidden>Cancel</button></div>
    </form>
    <div class="msg" id="txMsg"></div>
  </div>

  <div class="card">
    <div class="bar">
      <h2 style="margin:0">Transactions</h2>
      <select id="typeFilter"><option value="">All</option><option value="income">Income</option><option value="expense">Expenses</option></select>
    </div>
    <div class="wrap"><table>
      <thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Note</th><th>Amount</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const fmt = n => Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token = localStorage.getItem('token'), registering = false, editingId = null;

async function api(url, opts = {}) {
  const res = await fetch(url, { ...opts, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) } });
  const data = await res.json();
  if (res.status === 401 && token) { logout(); }
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

// ----- auth -----
function setAuthMode(reg) {
  registering = reg;
  $('#authTitle').textContent = reg ? 'Register' : 'Log in';
  $('#authBtn').textContent = reg ? 'Create account' : 'Log in';
  $('#nameField').hidden = !reg;
  $('#nameField').required = reg;
  $('#toggleAuth').textContent = reg ? 'Have an account? Log in' : 'No account? Register';
  $('#authMsg').textContent = '';
}
$('#toggleAuth').onclick = () => setAuthMode(!registering);

$('#authForm').addEventListener('submit', async e => {
  e.preventDefault();
  try {
    const body = Object.fromEntries(new FormData(e.target));
    const r = await api('/api/auth/' + (registering ? 'register' : 'login'), { method: 'POST', body: JSON.stringify(body) });
    token = r.token; localStorage.setItem('token', token);
    e.target.reset(); showApp(r.user);
  } catch (err) { $('#authMsg').textContent = err.message; }
});

function logout() {
  token = null; localStorage.removeItem('token');
  $('#authView').hidden = false; $('#dash').hidden = true; $('#userBox').hidden = true;
}
$('#logout').onclick = logout;

function showApp(user) {
  $('#authView').hidden = true; $('#dash').hidden = false; $('#userBox').hidden = false;
  $('#userName').textContent = user.name;
  if (!$('#month').value) $('#month').value = new Date().toISOString().slice(0, 7);
  if (!$('#txForm').date.value) $('#txForm').date.value = new Date().toISOString().slice(0, 10);
  refresh();
}

// ----- data -----
async function refresh() {
  const month = $('#month').value, type = $('#typeFilter').value;
  const [sum, list] = await Promise.all([
    api('/api/summary?month=' + month),
    api(`/api/transactions?month=${month}${type ? '&type=' + type : ''}`)
  ]);
  $('#sIncome').textContent = fmt(sum.income);
  $('#sExpense').textContent = fmt(sum.expense);
  $('#sBalance').textContent = fmt(sum.balance);
  $('#sBalance').className = sum.balance >= 0 ? 'inc' : 'exp';
  renderCats(sum.byCategory, sum.expense);
  renderTrend(sum.trend);
  $('#rows').innerHTML = list.length ? list.map(t => `
    <tr>
      <td>${t.date}</td>
      <td class="${t.type === 'income' ? 'inc' : 'exp'}">${t.type}</td>
      <td>${esc(t.category)}</td><td>${esc(t.description)}</td>
      <td class="${t.type === 'income' ? 'inc' : 'exp'}">${t.type === 'income' ? '+' : '-'}${fmt(t.amount)}</td>
      <td><div class="row"><button class="ghost" onclick='edit(${JSON.stringify(t)})'>Edit</button><button class="danger" onclick="del(${t.id})">Delete</button></div></td>
    </tr>`).join('') : '<tr><td colspan="6" class="empty">No transactions this month.</td></tr>';
}

function renderCats(cats, total) {
  $('#cats').innerHTML = cats.length ? cats.map(c => `
    <div class="cat"><div class="row" style="justify-content:space-between"><span>${esc(c.category)}</span><span>${fmt(c.total)} (${Math.round(c.total / total * 100)}%)</span></div>
    <div class="track"><div class="fill" style="width:${c.total / total * 100}%"></div></div></div>`).join('')
    : '<div class="empty">No expenses this month.</div>';
}

function renderTrend(trend) {
  if (!trend.length) { $('#trend').innerHTML = '<div class="empty">No data yet.</div>'; return; }
  const W = 420, H = 190, pad = 24, max = Math.max(...trend.flatMap(t => [t.income, t.expense]), 1);
  const gw = (W - pad) / trend.length, bw = Math.min(26, gw / 3);
  const bars = trend.map((t, i) => {
    const x = pad + i * gw + gw / 2, hI = t.income / max * (H - 40), hE = t.expense / max * (H - 40);
    return `<rect x="${x - bw}" y="${H - 22 - hI}" width="${bw}" height="${hI}" fill="var(--inc)" rx="2"/>
            <rect x="${x}" y="${H - 22 - hE}" width="${bw}" height="${hE}" fill="var(--exp)" rx="2"/>
            <text x="${x}" y="${H - 6}" font-size="10" text-anchor="middle" fill="var(--muted)">${t.month.slice(2)}</text>`;
  }).join('');
  $('#trend').innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%">${bars}</svg>`;
}

// ----- transaction form -----
$('#txForm').addEventListener('submit', async e => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target));
  try {
    await api(editingId ? '/api/transactions/' + editingId : '/api/transactions',
      { method: editingId ? 'PUT' : 'POST', body: JSON.stringify(body) });
    resetForm(); $('#txMsg').textContent = ''; refresh();
  } catch (err) { $('#txMsg').textContent = err.message; }
});

function edit(t) {
  const f = $('#txForm');
  ['type', 'amount', 'category', 'date', 'description'].forEach(k => f[k].value = t[k]);
  editingId = t.id;
  $('#formTitle').textContent = 'Edit transaction #' + t.id;
  $('#txBtn').textContent = 'Save'; $('#txCancel').hidden = false;
  f.scrollIntoView({ behavior: 'smooth' });
}
function resetForm() {
  const f = $('#txForm'); f.reset(); f.date.value = new Date().toISOString().slice(0, 10);
  editingId = null; $('#formTitle').textContent = 'Add transaction';
  $('#txBtn').textContent = 'Add'; $('#txCancel').hidden = true;
}
$('#txCancel').onclick = resetForm;

async function del(id) {
  if (!confirm('Delete this transaction?')) return;
  await api('/api/transactions/' + id, { method: 'DELETE' }); refresh();
}
$('#month').onchange = refresh;
$('#typeFilter').onchange = refresh;

// ----- boot -----
if (token) api('/api/auth/me').then(showApp).catch(logout);
</script>
</body>
</html>
